{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "incident-triage-mcp.fullname" . }}-env
  labels:
    {{- include "incident-triage-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secretEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}

{{- if and .Values.agentJob.enabled .Values.agentJob.secretEnv }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "incident-triage-mcp.agentJobSecretName" . }}
  labels:
    {{- include "incident-triage-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.agentJob.secretEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}

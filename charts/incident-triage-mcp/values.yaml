replicaCount: 1

image:
  repository: ghcr.io/felixkwasisarpong/incident-triage-mcp
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

# ServiceAccount created for the MCP server pods.
# Set annotations for cloud-provider workload identity (IRSA, Workload Identity, etc.).
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Example for AWS IRSA:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/incident-triage-mcp

containerPort: 3333

service:
  type: ClusterIP
  port: 80
  targetPort: 3333

podAnnotations: {}
podLabels: {}

# HTTP liveness and readiness probes.
# The MCP server exposes /health and /ready on containerPort.
# Set to {} to disable a probe.
livenessProbe:
  httpGet:
    path: /health
    port: 3333
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 3333
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

env:
  MCP_TRANSPORT: streamable-http
  DEPLOYMENT_PROFILE: local
  MCP_HOST: 0.0.0.0
  MCP_PORT: "3333"
  AUDIT_MODE: stdout

# ConfigMap for non-secret environment variables (observability providers, feature flags, etc.).
# All keys are injected into the container as env vars via envFrom.
configMap:
  enabled: false
  data: {}
  # Example:
  # data:
  #   METRICS_PROVIDER: prometheus
  #   ALERT_PROVIDER: pagerduty
  #   LOGS_PROVIDER: elk
  #   AUDIT_MODE: stdout

# Ingress to expose the MCP server outside the cluster.
# Disabled by default — enable and configure for your ingress controller.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Example for nginx-ingress with TLS:
  # annotations:
  #   kubernetes.io/ingress.class: nginx
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: incident-triage-mcp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Example:
  # tls:
  #   - secretName: incident-triage-mcp-tls
  #     hosts:
  #       - incident-triage-mcp.example.com

# Plaintext secrets for quickstart only.
# Use external secret management in production.
secretEnv: {}

# Raw env entries merged into container env list.
# Example:
# extraEnv:
#   - name: EVIDENCE_BACKEND
#     value: fs
extraEnv: []

# Extra volume mounts for shared artifacts/runbooks/etc.
# Example:
# extraVolumeMounts:
#   - name: airflow-artifacts
#     mountPath: /shared/artifacts
#     readOnly: true
extraVolumeMounts: []

# Extra pod volumes corresponding to extraVolumeMounts.
# Example:
# extraVolumes:
#   - name: airflow-artifacts
#     persistentVolumeClaim:
#       claimName: airflow-artifacts-pvc
extraVolumes: []

# Optional one-shot LangGraph agent Job (runs `incident-triage-agent` against this MCP service).
# This is useful for prod-sim/manual incident runs and for event-driven dispatchers that create Jobs.
agentJob:
  enabled: false

  # Job lifecycle controls
  restartPolicy: Never
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600

  # Agent image defaults to the chart image when left blank.
  image:
    repository: ""
    tag: ""
    pullPolicy: ""

  resources: {}

  # Required when enabled (unless overridden via extraArgs):
  incidentId: ""
  service: ""

  # Optional agent flags
  includeTicket: false
  compact: true

  # Remote MCP target. Defaults to this chart's service (/mcp) when blank.
  mcpUrl: ""

  # Additional CLI flags appended to the generated args list.
  # Example:
  # extraArgs:
  #   - --notify-slack
  #   - --notify-provider
  #   - teams
  extraArgs: []

  # Agent runtime env/secrets.
  # Use MCP_HTTP_API_KEY in secretEnv so the agent can authenticate to MCP without putting the key in args.
  env: {}
  secretEnv: {}

  extraEnv: []

  extraVolumeMounts: []
  extraVolumes: []

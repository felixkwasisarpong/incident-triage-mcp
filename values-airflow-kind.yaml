executor: LocalExecutor

postgresql:
  enabled: true

redis:
  enabled: false

dags:
  persistence:
    enabled: true
    existingClaim: airflow-dags-pvc

webserver:
  defaultUser:
    enabled: true
    username: admin
    password: admin
    role: Admin
    email: admin@example.com
  extraVolumes:
    - name: airflow-artifacts
      persistentVolumeClaim:
        claimName: airflow-artifacts-pvc
  extraVolumeMounts:
    - name: airflow-artifacts
      mountPath: /shared/artifacts

scheduler:
  extraVolumes:
    - name: airflow-artifacts
      persistentVolumeClaim:
        claimName: airflow-artifacts-pvc
  extraVolumeMounts:
    - name: airflow-artifacts
      mountPath: /shared/artifacts

triggerer:
  extraVolumes:
    - name: airflow-artifacts
      persistentVolumeClaim:
        claimName: airflow-artifacts-pvc
  extraVolumeMounts:
    - name: airflow-artifacts
      mountPath: /shared/artifacts

extraEnv: |
  - name: ARTIFACT_STORE
    value: "fs"
  - name: INCIDENT_ARTIFACT_DIR
    value: "/shared/artifacts"
  - name: AIRFLOW_ARTIFACT_DIR
    value: "/shared/artifacts"


config:
  api:
    auth_backends: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
  core:
    load_examples: "False"


dags:
  persistence:
    enabled: true
    existingClaim: airflow-dags-pvc

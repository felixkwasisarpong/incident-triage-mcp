apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-triage-mcp
  namespace: incident-triage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-triage-mcp
  template:
    metadata:
      labels:
        app: incident-triage-mcp
    spec:
      containers:
        - name: mcp
          image: incident-triage-mcp:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3333
          env:
            - name: MCP_TRANSPORT
              value: "streamable-http"
            - name: DEPLOYMENT_PROFILE
              value: "local"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "3333"
            - name: AUDIT_MODE
              value: "stdout"
            # Airflow in-cluster service URL (incident-triage namespace).
            # For local docker-compose testing use http://host.docker.internal:8080 instead.
            - name: AIRFLOW_BASE_URL
              value: "http://airflow-api-server.incident-triage.svc.cluster.local:8080"
            - name: AIRFLOW_USERNAME
              valueFrom:
                secretKeyRef:
                  name: airflow-creds
                  key: username
            - name: AIRFLOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-creds
                  key: password

            - name: ARTIFACT_STORE
              value: "s3"
            - name: S3_ENDPOINT_URL
              value: "http://minio.incident-triage.svc.cluster.local:9000"
            - name: S3_BUCKET
              value: "triage-artifacts"
            - name: S3_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: secret_access_key

          readinessProbe:
            httpGet:
              path: /ready
              port: 3333
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3333
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

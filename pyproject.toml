[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-triage-mcp"
version = "0.2.6"
description = "MCP server for evidence-driven incident triage with safe actions, Jira, Slack, and optional Airflow integration."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.26.0",
  "pydantic>=2.5",
  "requests>=2.31",
  "langgraph>=0.2"
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[project.scripts]
incident-triage-mcp = "incident_triage_mcp.server:main"
incident-triage-agent = "incident_triage_mcp.agents.langgraph_agent:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

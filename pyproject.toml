[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-triage-mcp"
version = "0.2.3"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.26.0",
  "pydantic>=2.5",
  "requests>=2.31",
  "boto3>=1.34",
  "langgraph>=0.2"
]

[project.scripts]
incident-triage-mcp = "incident_triage_mcp.server:main"
incident-triage-agent = "incident_triage_mcp.agents.langgraph_agent:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

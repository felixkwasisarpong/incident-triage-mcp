name: Contracts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  spec-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest jsonschema

      - name: Run spec contract tests
        run: |
          pytest -q \
            tests/test_contract_evidence_bundle.py \
            tests/test_contract_mcp_tools.py

  contrib-structure-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate contrib structure and secret hygiene
        run: python scripts/validate_contrib.py

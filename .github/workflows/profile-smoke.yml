name: Deployment Profile Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  profile-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Profile env templates smoke
        run: ./scripts/smoke_profiles.sh

      - name: Profile unit tests
        run: uv run --project . python -m unittest tests.test_adapter_scaffold tests.test_deployment_profiles -v

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(python - <<'PY'
          from pathlib import Path
          import tomllib
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data.get("project", {}).get("version")
          if not version:
              raise SystemExit("Could not find project version in pyproject.toml")
          print(version)
          PY
          )"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject version v${VERSION}"
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Ensure PyPI token exists
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "::error::Missing repository secret PYPI_API_TOKEN"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Docker Hub secrets exist
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "::error::Missing repository secret DOCKERHUB_USERNAME"
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Missing repository secret DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Set image names
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          DOCKERHUB_USER_LOWER="$(printf '%s' "${DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]')"
          DOCKERHUB_IMAGE="docker.io/${DOCKERHUB_USER_LOWER}/incident-triage-mcp"
          DOCKERHUB_REPO="${DOCKERHUB_USER_LOWER}/incident-triage-mcp"
          echo "ghcr=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_repo=${DOCKERHUB_REPO}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.image.outputs.ghcr }}
            ${{ steps.image.outputs.dockerhub }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.image.outputs.dockerhub_repo }}
          short-description: Model Context Protocol server for evidence-driven incident triage with safe actions and workflow integrations.
          readme-filepath: ./README_PYPI.md

  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - publish-pypi
      - publish-docker

    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

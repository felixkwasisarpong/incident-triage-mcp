name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate tag matches pyproject version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(python - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data.get("project", {}).get("version")
          if not version:
              raise SystemExit("Could not find project version in pyproject.toml")
          print(version)
          PY
          )"

          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject version v${VERSION}"
            exit 1
          fi

          echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Validated release version: ${VERSION}"

  build-python:
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish-pypi:
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-python
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI (trusted publishing)
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Publish to PyPI (token fallback)
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist

  publish-docker:
    runs-on: ubuntu-latest
    needs: validate-tag
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      ghcr_image: ${{ steps.vars.outputs.ghcr_image }}
      release_tag: ${{ steps.vars.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image names
        id: vars
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          RELEASE_TAG="${GITHUB_REF_NAME#v}"

          IMAGES="${GHCR_IMAGE}"
          DOCKERHUB_ENABLED=false
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            DOCKERHUB_USER_LOWER="$(printf '%s' "${DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]')"
            IMAGES="${IMAGES}\ndocker.io/${DOCKERHUB_USER_LOWER}/incident-triage-mcp"
            DOCKERHUB_ENABLED=true
          fi

          {
            echo "ghcr_image=${GHCR_IMAGE}"
            echo "release_tag=${RELEASE_TAG}"
            echo "dockerhub_enabled=${DOCKERHUB_ENABLED}"
            echo "images<<EOF"
            printf '%b\n' "${IMAGES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (optional)
        if: ${{ steps.vars.outputs.dockerhub_enabled == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch image (with provenance + SBOM attestation)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.release_tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Generate image SBOM file
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.vars.outputs.ghcr_image }}:${{ steps.vars.outputs.release_tag }}
          format: spdx-json
          output-file: docker-image.sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-sbom
          path: docker-image.sbom.spdx.json

      - name: Install cosign (optional)
        continue-on-error: true
        uses: sigstore/cosign-installer@v3

      - name: Sign GHCR image with keyless OIDC (optional, non-blocking)
        if: ${{ steps.build.outputs.digest != '' }}
        continue-on-error: true
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ steps.vars.outputs.ghcr_image }}@${{ steps.build.outputs.digest }}"

  github-release:
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - publish-pypi
      - publish-docker
    permissions:
      contents: write
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Download Docker SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-sbom
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            release-assets/docker-image.sbom.spdx.json

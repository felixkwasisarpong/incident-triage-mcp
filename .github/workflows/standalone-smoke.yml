name: Standalone Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  standalone-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Standalone smoke script
        run: ./scripts/smoke_standalone.sh INC-CI payments-api

      - name: Standalone mode tests
        run: uv run --project . python -m unittest tests.test_standalone_mode -v

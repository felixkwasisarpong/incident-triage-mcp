name: Docker CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  docker-build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: local/incident-triage-mcp:ci
          build-args: |
            VERSION=ci
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container health endpoint
        run: |
          docker run -d --rm \
            --name incident-triage-mcp-ci \
            -p 3333:3333 \
            -e MCP_TRANSPORT=streamable-http \
            -e MCP_HOST=0.0.0.0 \
            -e MCP_PORT=3333 \
            local/incident-triage-mcp:ci

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3333/healthz >/tmp/healthz.json; then
              cat /tmp/healthz.json
              exit 0
            fi
            sleep 1
          done

          echo "Container failed health check; dumping logs"
          docker logs incident-triage-mcp-ci || true
          exit 1

      - name: Dump container logs
        if: always()
        run: docker logs incident-triage-mcp-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f incident-triage-mcp-ci || true

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check (changed Python files)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          def _diff_name_only(rev: str):
              try:
                  out = subprocess.check_output(
                      ["git", "diff", "--name-only", rev],
                      text=True,
                  )
              except subprocess.CalledProcessError:
                  return None
              return out.splitlines()

          event_name = os.getenv("GITHUB_EVENT_NAME", "")
          files = []

          if event_name == "pull_request":
              base_ref = os.getenv("GITHUB_BASE_REF", "main")
              subprocess.run(
                  ["git", "fetch", "--no-tags", "origin", base_ref],
                  check=True,
              )
              files = _diff_name_only(f"origin/{base_ref}...HEAD")
              if files is None:
                  # Fallback for edge cases with no merge base available.
                  files = _diff_name_only(f"origin/{base_ref}..HEAD")
              if files is None:
                  raise RuntimeError("Unable to compute changed files against base branch")
          else:
              before = os.getenv("GITHUB_EVENT_BEFORE", "")
              if before and set(before) != {"0"}:
                  files = _diff_name_only(f"{before}...HEAD")
                  if files is None:
                      files = _diff_name_only(f"{before}..HEAD")
                  if files is None:
                      raise RuntimeError("Unable to compute changed files for push event")
              else:
                  changed = subprocess.check_output(
                      ["git", "show", "--name-only", "--pretty=", "HEAD"],
                      text=True,
                  )
                  files = changed.splitlines()

          py_files = [
              path
              for path in files
              if path.endswith(".py")
              and (path.startswith("src/") or path.startswith("tests/"))
          ]

          if not py_files:
              print("No changed Python files to format-check.")
              sys.exit(0)

          print("Running format check on:")
          for path in py_files:
              print(f"- {path}")

          subprocess.run(["ruff", "format", "--check", *py_files], check=True)
          PY

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest -q

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MISSING=""
          while IFS= read -r sha; do
            msg=$(git log --format=%B -n 1 "$sha")
            if ! echo "$msg" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
              MISSING="$MISSING\n  $sha"
            fi
          done < <(git log --format=%H "$BASE..$HEAD")
          if [ -n "$MISSING" ]; then
            echo "ERROR: The following commits are missing a 'Signed-off-by:' trailer:"
            echo -e "$MISSING"
            echo ""
            echo "Please amend them with: git commit --amend --signoff"
            echo "Or sign-off future commits with: git commit -s"
            exit 1
          fi
          echo "All commits have a DCO sign-off."

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          license-check: false

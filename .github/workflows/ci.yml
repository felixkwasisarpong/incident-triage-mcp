name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-yaml-json-md:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install yamllint

      - name: Lint YAML
        run: |
          yamllint -c .yamllint.yml \
            .github/workflows \
            .github/ISSUE_TEMPLATE \
            .github/labels.yml \
            docs/docker-mcp-registry/incident-triage-mcp/server.yaml \
            docker-compose.yml \
            k8s

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          import pathlib

          files = [pathlib.Path(p) for p in """server.json docs/docker-mcp-registry/incident-triage-mcp/tools.json""".split()]
          for fp in files:
              with fp.open("r", encoding="utf-8") as fh:
                  json.load(fh)
              print(f"valid json: {fp}")
          PY

      - name: Lint Markdown (lightweight)
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          config: .markdownlint.yml
          globs: |
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            GOVERNANCE.md
            MAINTAINERS.md
            AGENTS.md
            docs/**/*.md

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

  security-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          vulnerability-check: true
          license-check: false

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check (changed Python files)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          event_name = os.getenv("GITHUB_EVENT_NAME", "")
          files = []

          if event_name == "pull_request":
              base_ref = os.getenv("GITHUB_BASE_REF", "main")
              subprocess.run(
                  ["git", "fetch", "--no-tags", "--depth=1", "origin", base_ref],
                  check=True,
              )
              diff = subprocess.check_output(
                  ["git", "diff", "--name-only", f"origin/{base_ref}...HEAD"],
                  text=True,
              )
              files = diff.splitlines()
          else:
              before = os.getenv("GITHUB_EVENT_BEFORE", "")
              if before and set(before) != {"0"}:
                  diff = subprocess.check_output(
                      ["git", "diff", "--name-only", f"{before}...HEAD"],
                      text=True,
                  )
                  files = diff.splitlines()
              else:
                  changed = subprocess.check_output(
                      ["git", "show", "--name-only", "--pretty=", "HEAD"],
                      text=True,
                  )
                  files = changed.splitlines()

          py_files = [
              path
              for path in files
              if path.endswith(".py")
              and (path.startswith("src/") or path.startswith("tests/"))
          ]

          if not py_files:
              print("No changed Python files to format-check.")
              sys.exit(0)

          print("Running format check on:")
          for path in py_files:
              print(f"- {path}")

          subprocess.run(["ruff", "format", "--check", *py_files], check=True)
          PY

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest -q

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          license-check: false
